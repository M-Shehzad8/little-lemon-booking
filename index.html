<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive viewport (required for mobile layout) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Brand typefaces: Markazi Text (headlines) + Karla (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Markazi+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Standard meta tags -->
    <meta name="title" content="Little Lemon - Book a Table" />
    <meta
      name="description"
      content="Book a table at Little Lemon, a charming family Mediterranean restaurant. Reserve your seating online in seconds."
    />
    <meta name="keywords" content="Little Lemon, restaurant, booking, table reservation, Mediterranean food" />
    <meta name="author" content="Little Lemon" />
    <meta name="theme-color" content="#495E57" />

    <!-- Open Graph Protocol tags (criterion 4) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Little Lemon" />
    <meta property="og:title" content="Little Lemon - Book a Table" />
    <meta
      property="og:description"
      content="Reserve a table at Little Lemon, a cozy Mediterranean restaurant. Book your seating online."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://littlelemon.example.com/booking" />
    <meta
      property="og:image"
      content="https://littlelemon.example.com/og-image.png"
    />
    <meta property="og:image:alt" content="Little Lemon restaurant logo and storefront" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card (optional companion to OG) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Little Lemon - Book a Table" />
    <meta
      name="twitter:description"
      content="Reserve a table at Little Lemon, a cozy Mediterranean restaurant."
    />
    <meta
      name="twitter:image"
      content="https://littlelemon.example.com/og-image.png"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Little Lemon - Book a Table</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
